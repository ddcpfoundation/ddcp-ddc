[package]
name = "ddcp-ddc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DDC Issuer Operations Program — Token-2022 mint governance (8 instructions, 4 PDAs)"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

# The solana_program::entrypoint! macro expands cfgs evaluated in this crate
# (target_os = "solana" under build-sbf; custom-heap / custom-panic opt-ins).
# Declare them so host builds don't emit unexpected_cfgs warnings.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }

# Exact pins: versions verified by compile probe
# (I-1 builder sequence), duplicate-major analysis, and SBF toolchain gate
# (platform-tools v1.52), all on 2026-07-10.
[dependencies]
solana-program = "=4.0.0"
spl-token-2022-interface = "=3.1.1"
spl-token-metadata-interface = "=1.0.1"
solana-zk-sdk-pod = "=0.1.2"
borsh = "=1.7.0"

[dev-dependencies]
# Discriminator re-derivation in unit tests (cross-implementation check against
# the Python-computed constants). Pinned to the version already in the graph.
sha2 = "=0.10.9"
# LiteSVM integration-test stack. Exact pins verified by a 2026-07-11
# probe: resolution, duplicate-major confinement, and
# compile type-boundary check against the solana-program 4.0.0 line. Do NOT bump
# litesvm to 0.13.x without re-probing — its `solana-instruction = "=3.2.0"` pin
# is unresolvable against spl-token-2022-interface 3.1.1 (requires ^3.3).
# Dev-dependencies never enter the on-chain binary (cargo build-sbf builds the
# lib target only).
litesvm = "=0.12.0"
solana-account = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = "=3.1.0"
# Typed TransactionError matching in test asserts. InstructionError comes via
# the solana-program umbrella re-export.
solana-transaction-error = "=3.3.1"
# Fixture feature set: FeatureSet::all_enabled() — a workaround for litesvm
# 0.12's frozen mainnet snapshot rejecting platform-tools v1.52's f64 lowering.
# NOT a cluster-parity proxy; devnet is the parity check. Version already in
# litesvm's resolved dev graph.
agave-feature-set = "=3.1.14"
